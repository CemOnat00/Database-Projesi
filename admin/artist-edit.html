<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Artist — The Curated Gallery · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet" />
  <script src="../js/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-nav="admin" data-active="artists" class="min-h-screen bg-bg text-ink">

  <div id="navbar-root"></div>

  <main class="max-w-4xl mx-auto px-6 lg:px-12 py-12">

    <nav class="text-[11px] uppercase tracking-lux text-ink-muted mb-8">
      <a href="artists.html" class="hover:text-ink-strong">Artists</a>
      <span class="mx-2 text-ink-faint">/</span>
      <span id="page-mode" class="text-ink-strong">New</span>
    </nav>

    <header class="mb-10">
      <p class="text-[11px] uppercase tracking-lux text-ink-muted mb-3">Artist Roster</p>
      <h1 id="page-title" class="font-display text-5xl text-ink-strong">New Artist</h1>
      <p class="mt-3 text-sm text-ink-muted">Add a new artist to the gallery roster.</p>
    </header>

    <form id="artist-form" class="bg-surface border border-line p-8 space-y-8">

      <div class="space-y-6">
        <div>
          <label class="block text-[11px] uppercase tracking-lux text-ink-muted mb-2">Full Name *</label>
          <input name="ad_soyad" type="text" required minlength="2" maxlength="100" placeholder="e.g. Elena Rostova" class="w-full bg-transparent border-b border-line pb-2 focus:outline-none focus:border-brand" />
        </div>

        <div>
          <label class="block text-[11px] uppercase tracking-lux text-ink-muted mb-2">Biography</label>
          <textarea name="biyografi" rows="6" placeholder="Where they live, what they make, what drives the practice…" class="w-full border border-line p-3 focus:outline-none focus:border-brand bg-transparent text-sm"></textarea>
        </div>
      </div>

      <p id="form-msg" class="text-[11px] uppercase tracking-lux min-h-[1rem]"></p>

      <div class="flex flex-col sm:flex-row gap-3 border-t border-line pt-6">
        <button type="submit" id="submit-btn" class="group flex-1 bg-brand hover:bg-brand-hover text-white py-4 text-[11px] uppercase tracking-lux flex items-center justify-center gap-3 transition-colors">
          <span id="submit-label">Save Artist</span>
          <svg width="16" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.5" class="motion-safe:transition-transform group-hover:translate-x-1"><path d="M1 5h15M12 1l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a href="artists.html" class="flex-1 border border-ink-strong/30 py-4 text-[11px] uppercase tracking-lux text-ink-strong hover:bg-ink-strong hover:text-white transition-colors text-center">Cancel</a>
      </div>

      <p class="text-[11px] text-ink-muted leading-relaxed">All changes save to the backend immediately.</p>
    </form>

  </main>

  <div id="footer-root"></div>

  <script src="../js/api.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/admin/artist-edit.js"></script>
</body>
</html>
