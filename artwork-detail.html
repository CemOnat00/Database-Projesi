<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artwork — The Curated Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet" />
  <script src="js/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-active="gallery" class="min-h-screen bg-bg text-ink">

  <div id="navbar-root"></div>

  <main>
    <!-- BREADCRUMB -->
    <div class="max-w-7xl mx-auto px-6 lg:px-12 pt-10 text-[11px] uppercase tracking-lux text-ink-muted">
      <a href="gallery.html" class="hover:text-ink-strong">Gallery</a>
      <span class="mx-2 text-ink-faint">/</span>
      <span id="bc-medium">Medium</span>
      <span class="mx-2 text-ink-faint">/</span>
      <span id="bc-title" class="text-ink-strong">Title</span>
    </div>

    <!-- MAIN -->
    <section class="max-w-7xl mx-auto px-6 lg:px-12 py-12 grid lg:grid-cols-2 gap-12 lg:gap-16">

      <div class="space-y-4">
        <figure class="overflow-hidden bg-bg-image aspect-[4/5]">
          <img id="hero-image" src="" alt="" class="w-full h-full object-cover" />
        </figure>
        <div id="thumb-grid" class="grid grid-cols-4 gap-3"></div>
      </div>

      <div>
        <span id="a-meta-line" class="text-[11px] uppercase tracking-lux text-ink-muted"></span>
        <h1 id="a-title" class="font-display text-4xl md:text-5xl text-ink-strong mt-3 leading-tight"></h1>
        <p id="a-artist" class="text-ink-muted mt-2 text-lg italic font-display"></p>
        <p id="a-desc" class="mt-6 text-ink-muted leading-relaxed"></p>

        <div class="mt-8 flex items-end justify-between border-t border-b border-line py-5">
          <span class="text-[11px] uppercase tracking-lux text-ink-muted">Price</span>
          <span id="a-price" class="font-display text-3xl text-ink-strong"></span>
        </div>

        <!-- Actions -->
        <div class="mt-6 flex flex-col sm:flex-row gap-3">
          <button id="add-cart-btn" class="group flex-1 bg-brand hover:bg-brand-hover text-white py-4 text-[11px] uppercase tracking-lux flex items-center justify-center gap-3 transition-colors">
            Add to Cart
            <svg width="16" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.5" class="motion-safe:transition-transform group-hover:translate-x-1"><path d="M1 5h15M12 1l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="fav-btn" class="flex-1 border border-ink-strong/30 py-4 text-[11px] uppercase tracking-lux text-ink-strong hover:bg-ink-strong hover:text-white transition-colors flex items-center justify-center gap-3">
            <svg id="fav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="fav-label">Add to Favorites</span>
          </button>
        </div>

        <!-- Details table -->
        <dl class="mt-10 border-t border-line">
          <div class="flex justify-between py-4 border-b border-line"><dt class="text-[11px] uppercase tracking-lux text-ink-muted">Medium</dt><dd id="det-medium" class="text-sm text-ink-strong"></dd></div>
          <div class="flex justify-between py-4 border-b border-line"><dt class="text-[11px] uppercase tracking-lux text-ink-muted">Dimensions</dt><dd id="det-dim" class="text-sm text-ink-strong"></dd></div>
          <div class="flex justify-between py-4 border-b border-line"><dt class="text-[11px] uppercase tracking-lux text-ink-muted">Year</dt><dd id="det-year" class="text-sm text-ink-strong"></dd></div>
          <div class="flex justify-between py-4 border-b border-line"><dt class="text-[11px] uppercase tracking-lux text-ink-muted">Edition</dt><dd id="det-edition" class="text-sm text-ink-strong"></dd></div>
          <div class="flex justify-between py-4 border-b border-line"><dt class="text-[11px] uppercase tracking-lux text-ink-muted">Authenticity</dt><dd id="det-auth" class="text-sm text-ink-strong"></dd></div>
          <div class="flex justify-between py-4 border-b border-line"><dt class="text-[11px] uppercase tracking-lux text-ink-muted">Shipping</dt><dd id="det-shipping" class="text-sm text-ink-strong"></dd></div>
        </dl>

        <div class="mt-6 flex gap-6 text-[11px] uppercase tracking-lux text-ink-muted">
          <span><strong id="stat-likes" class="text-ink-strong">0</strong> favorites</span>
          <span><strong id="stat-views" class="text-ink-strong">0</strong> views</span>
          <span><strong id="stat-reviews" class="text-ink-strong">0</strong> reviews</span>
        </div>
      </div>
    </section>

    <!-- ARTIST -->
    <section class="bg-surface border-y border-line">
      <div class="max-w-7xl mx-auto px-6 lg:px-12 py-16 grid md:grid-cols-3 gap-10">
        <div class="md:col-span-1">
          <p class="text-[11px] uppercase tracking-lux text-ink-muted mb-3">The Artist</p>
          <h2 id="artist-name" class="font-display text-3xl text-ink-strong"></h2>
          <p id="artist-bio" class="mt-4 text-ink-muted leading-relaxed"></p>
          <a href="#" class="mt-5 inline-block text-[11px] uppercase tracking-lux text-brand border-b border-brand pb-1">View Full Biography</a>
        </div>
        <div class="md:col-span-2">
          <p id="artist-other-heading" class="text-[11px] uppercase tracking-lux text-ink-muted mb-4">More by this artist</p>
          <div id="artist-other" class="grid grid-cols-3 gap-4"></div>
        </div>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="max-w-7xl mx-auto px-6 lg:px-12 py-20">
      <div class="flex flex-col md:flex-row justify-between md:items-end gap-6 mb-12">
        <div>
          <p class="text-[11px] uppercase tracking-lux text-ink-muted mb-3">Reviews</p>
          <h2 class="font-display text-4xl text-ink-strong">Collector Voices</h2>
        </div>
        <div class="flex items-center gap-4">
          <div id="rev-stars"></div>
          <p id="rev-summary" class="text-sm text-ink-strong"></p>
          <select class="border-b border-line pb-1 text-sm bg-transparent focus:outline-none focus:border-brand">
            <option>Most Recent</option><option>Highest Rated</option><option>Most Helpful</option>
          </select>
        </div>
      </div>

      <div id="review-list" class="grid md:grid-cols-2 gap-6"></div>

      <div class="mt-12 bg-surface border border-line p-8">
        <h3 class="font-display text-2xl text-ink-strong mb-2">Share Your Impression</h3>
        <p class="text-[11px] uppercase tracking-lux text-ink-muted mb-6">Only signed-in collectors who own this work may write a review.</p>
        <form id="review-form" class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-[11px] uppercase tracking-lux text-ink-muted mb-2">Rating</label>
            <div class="flex gap-1">
              <button type="button" data-r="1" class="star text-line hover:text-accent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
              <button type="button" data-r="2" class="star text-line hover:text-accent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
              <button type="button" data-r="3" class="star text-line hover:text-accent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
              <button type="button" data-r="4" class="star text-line hover:text-accent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
              <button type="button" data-r="5" class="star text-line hover:text-accent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
            </div>
          </div>
          <div>
            <label class="block text-[11px] uppercase tracking-lux text-ink-muted mb-2">Display Name</label>
            <input type="text" required class="w-full border-b border-line pb-2 focus:outline-none focus:border-brand bg-transparent" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-[11px] uppercase tracking-lux text-ink-muted mb-2">Your Words</label>
            <textarea rows="4" required class="w-full border border-line p-3 focus:outline-none focus:border-brand bg-transparent text-sm"></textarea>
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="bg-brand hover:bg-brand-hover text-white px-10 py-4 text-[11px] uppercase tracking-lux transition-colors">Submit Review</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/artwork-detail.js"></script>
</body>
</html>
